name: "Execute Regression"
on:
  workflow_dispatch:
  push:
    branches:
      - sample
      - feature/*
jobs:
  setup-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "test-case-setup"
        run: |
          cd test
          ls -l 
          java -version
          echo "Setup done" 
  execute-job:
    runs-on: ubuntu-latest
    needs: setup-job
    steps:
      - name: "execute-test-case"
        run: |
          java -Dfile.encoding=UTF-8 -classpath bin:resources test.testCBA
      - name: "save-test-report"
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./target/*